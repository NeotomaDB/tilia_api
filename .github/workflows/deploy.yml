name: Deploy the Neotoma Tilia API

on:
  push:
    branches: [production, develop]

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # NOTE: ENDPOINT is passed to CloudFormation as `DomainName`, which the template
      # uses ONLY to build the `CustomDomainURL` output string. It does not create or
      # change any DNS record or App Runner custom-domain association -- those were set
      # up by hand in the App Runner console. Editing these values relabels the output;
      # it does not reroute traffic.
      - name: Set environment based on branch
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/production' ]]; then
            echo "ENVIRONMENT=tprod" >> $GITHUB_ENV
            echo "STACK_NAME=neotilia-prod" >> $GITHUB_ENV
            echo "RDSDB=neotoma" >> $GITHUB_ENV
            echo "ENDPOINT=tilia.neotomadb.org" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=tdev" >> $GITHUB_ENV
            echo "STACK_NAME=neotilia-dev" >> $GITHUB_ENV
            echo "RDSDB=neotomatank" >> $GITHUB_ENV
            echo "ENDPOINT=tiliatank.neotomadb.org" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories \
            --repository-names neotilia-${{ env.ENVIRONMENT }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name neotilia-${{ env.ENVIRONMENT }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256
      - name: Build, tag, and push image to Amazon ECR
        run: |
          ECR_REPOSITORY=${{ steps.login-ecr.outputs.registry }}/neotilia-${{ env.ENVIRONMENT }}
          IMAGE_TAG=${{ github.sha }}

          echo "Building Docker image..."
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REPOSITORY:latest

          echo "Pushing to ECR..."
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:latest

          echo "IMAGE_URI=$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV

      - name: Debug parameters
        run: |
          echo "Subnets value: '${{ secrets.PRIVATE_SUBNETS }}'"
          echo "Length: ${#PRIVATE_SUBNETS}"
          PRIVATE_SUBNETS="${{ secrets.PRIVATE_SUBNETS }}"
          if [ -z "$PRIVATE_SUBNETS" ]; then
            echo "ERROR: PRIVATE_SUBNETS is empty!"
            exit 1
          fi
          echo "SUBNET_LIST=subnet-0e66614ca7e9e7247,subnet-013f8ff069404c987" >> $GITHUB_ENV

      - name: Deploy CloudFormation stack
        run: |
          echo "Deploying infrastructure with image: ${{ env.IMAGE_URI }}"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation-template.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --parameter-overrides \
              "Environment=${{ env.ENVIRONMENT }}" \
              "ImageUri=${{ env.IMAGE_URI }}" \
              "RDSHostname=${{ secrets.RDS_HOSTNAME }}" \
              "RDSDatabase=${{ env.RDSDB }}" \
              "RDSUsername=${{ secrets.RDS_USERNAME }}" \
              "RDSPassword=${{ secrets.RDS_PASSWORD }}" \
              "VPCId=${{ secrets.VPC_ID }}" \
              "PrivateSubnets=${{ env.SUBNET_LIST }}" \
              "DomainName=${{ env.ENDPOINT }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

      - name: Get service URL
        run: |
          SERVICE_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ServiceUrl`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

          echo "CloudFormation stack updated (this is NOT yet a successful deployment)."
          echo "Service URL: $SERVICE_URL"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Image: ${{ env.IMAGE_URI }}"

      # CloudFormation reporting UPDATE_COMPLETE only means App Runner ACCEPTED the new
      # image. App Runner then runs its own deployment, which can fail its health check
      # and silently roll back to the previous image. Because the old container keeps
      # serving the default App Runner URL, curling that URL returns 200 even after a
      # rollback -- so a curl-only check reports success on a failed deploy. (This is how
      # the tdev/tprod services sat on a Jan-2026 image for months while runs went green.)
      # Assert on the App Runner operation status, and confirm the image actually running.
      - name: Verify App Runner deployment
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --region ${{ env.AWS_REGION }} \
            --query "ServiceSummaryList[?ServiceName=='neoapi-${{ env.ENVIRONMENT }}'].ServiceArn" \
            --output text)

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "::error::Could not find App Runner service neoapi-${{ env.ENVIRONMENT }}"
            exit 1
          fi
          echo "Service ARN: $SERVICE_ARN"

          # App Runner deployments take roughly 3-7 minutes; wait for it to settle.
          OP_STATUS=""
          for i in $(seq 1 40); do
            OP=$(aws apprunner list-operations \
              --service-arn "$SERVICE_ARN" \
              --region ${{ env.AWS_REGION }} \
              --max-results 1 \
              --query 'OperationSummaryList[0].[Status,Type,StartedAt]' \
              --output text)
            OP_STATUS=$(echo "$OP" | awk '{print $1}')
            echo "[$i] operation: $OP"

            if [ "$OP_STATUS" != "IN_PROGRESS" ] && [ "$OP_STATUS" != "PENDING" ]; then
              break
            fi
            sleep 30
          done

          RUNNING_IMAGE=$(aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" \
            --region ${{ env.AWS_REGION }} \
            --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' \
            --output text)

          echo "Expected image: ${{ env.IMAGE_URI }}"
          echo "Running image:  $RUNNING_IMAGE"

          if [ "$OP_STATUS" != "SUCCEEDED" ]; then
            echo "::error::App Runner deployment did not succeed (status: $OP_STATUS)."
            echo "The service has rolled back and is still running the previous image."
            echo "Inspect the startup crash in CloudWatch:"
            echo "  aws logs filter-log-events --region ${{ env.AWS_REGION }} \\"
            echo "    --log-group-name /aws/apprunner/neoapi-${{ env.ENVIRONMENT }}/<service-id>/application"
            exit 1
          fi

          if [ "$RUNNING_IMAGE" != "${{ env.IMAGE_URI }}" ]; then
            echo "::error::Operation succeeded but the running image is not the one just pushed."
            exit 1
          fi

          echo "App Runner deployment succeeded and is running the expected image."

      - name: Health check
        run: |
          HEALTH_ENDPOINT="${{ env.SERVICE_URL }}/healthcheck"
          echo "Health check: $HEALTH_ENDPOINT"

          for ATTEMPT in $(seq 1 10); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_ENDPOINT" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi

            echo "Attempt $ATTEMPT/10 -> HTTP $HTTP_CODE; retrying in 15s"
            sleep 15
          done

          echo "::error::Health check failed after 10 attempts"
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful for ${{ env.ENVIRONMENT }}"
            echo "URL: ${{ env.SERVICE_URL }}"
          else
            echo "❌ Deployment failed for ${{ env.ENVIRONMENT }}"
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          aws cloudformation cancel-update-stack \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} || true
